<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none" role="img" aria-label="TCT Traders Logo">
  <defs>
    <linearGradient id="tct-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2874F0" />
      <stop offset="100%" stop-color="#0746C4" />
    </linearGradient>
    <linearGradient id="tct-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF6F00" />
    </linearGradient>
    <linearGradient id="tct-grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>
    <filter id="tct-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0746C4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 3D Geometric Trading Hexagon Icon -->
  <g transform="translate(6, 6)" filter="url(#tct-shadow)">
    <!-- Outer rounded hexagon/shield background -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#tct-grad-primary)" />
    
    <!-- Isometric Top Face -->
    <path d="M30 11 L48 21 L30 31 L12 21 Z" fill="#ffffff" fill-opacity="0.22" />
    
    <!-- Left Face -->
    <path d="M12 21 L30 31 L30 50 L12 40 Z" fill="#000000" fill-opacity="0.18" />
    
    <!-- Right Face -->
    <path d="M48 21 L48 40 L30 50 L30 31 Z" fill="#ffffff" fill-opacity="0.08" />

    <!-- Bold Interlocking Monogram T -->
    <path d="M18 19 H42 V25 H33 V44 H27 V25 H18 Z" fill="#ffffff" />
    
    <!-- Vibrant Golden Trading Sparkle / Cart Wing -->
    <circle cx="45" cy="14" r="5" fill="url(#tct-grad-accent)" />
    <path d="M43 14 L45 10 L47 14 L50 15 L47 16 L45 20 L43 16 L40 15 Z" fill="#FFF8E1" />
  </g>

  <!-- Typography -->
  <g transform="translate(78, 14)">
    <!-- Brand Title -->
    <text x="0" y="24" font-family="'Poppins', 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#0C1B33">
      TCT <tspan fill="#2874F0">TRADERS</tspan>
    </text>
    
    <!-- Flipkart-style Plus / Wholesale Pill -->
    <rect x="162" y="7" width="70" height="18" rx="9" fill="#FFF3CD" stroke="#FFEBA1" stroke-width="1"/>
    <text x="171" y="20" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="800" fill="#B76E00" letter-spacing="0.4">
      PLUS HUB ★
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="42" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#5B6B80" letter-spacing="0.3">
      PLASTIC WHOLESALE &amp; RETAIL · COIMBATORE
    </text>
  </g>
</svg>